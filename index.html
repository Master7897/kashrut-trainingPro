<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://script.google.com">
    <title data-i18n>לומדת כשרות – צוות מטבח</title>
    <link rel="stylesheet" href="style_v2.css" />
  </head>

  <body>
    <div id="rotateOverlay" class="rotate-overlay" hidden>
      <div class="rotate-card">
        <div class="rotate-title" data-i18n>אנא סובב חזרה לאורך</div>
        <div class="rotate-sub" data-i18n>השאלון עובד רק לאורך</div>
      </div>
    </div>

    <div class="container">
      <!-- START -->
      <section id="screen-start" class="card">
        <h1 data-i18n>הדרכת כשרות צוות מטבח</h1>
        <p class="muted" data-i18n>מלא/י פרטים כדי להתחיל.</p>

        <label for="language" data-i18n>שפה</label>
        <select id="language" autocomplete="language" data-no-translate="1">
          <option value="he">עברית</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="am">አማርኛ</option>
          <option value="ar">العربية</option>
        </select>

        <label for="fullName" data-i18n>שם מלא</label>
        <input
          id="fullName"
          type="text"
          placeholder="שמך..."
          data-i18n-placeholder
          autocomplete="name"
          aria-describedby="startError"
          maxlength="30"
        />

        <label for="personalId" data-i18n>תעודת זהות / מספר אישי</label>
        <input
          id="personalId"
          type="text"
          placeholder="ת.ז / מ.א"
          data-i18n-placeholder
          inputmode="numeric"
          autocomplete="off"
          aria-describedby="startError"
          maxlength="9"
        />

        <label for="kitchen" data-i18n>מטבח</label>
        <select id="kitchen" autocomplete="organization" aria-describedby="startError">
          <option value="" data-i18n>בחר/י מטבח</option>

          <!-- Demo kitchens (static fallback). These MUST NOT be translated. -->
          <option data-no-translate="1">מקל&quot;ר</option>
          <option data-no-translate="1">מקרפ&quot;ר ב</option>
          <option data-no-translate="1">חט&quot;ל</option>
          <option data-no-translate="1">מש&quot;א תל השומר</option>
          <option data-no-translate="1">בסיס ציוד</option>
          <option data-no-translate="1">מצר&quot;פ</option>
          <option data-no-translate="1">מש&quot;א צריפין</option>
          <option data-no-translate="1">דקל</option>
          <option data-no-translate="1">מרלו&quot;ג</option>
          <option data-no-translate="1">מפקדת מרה&quot;ס</option>
          <option data-no-translate="1">סביון</option>
          <option data-no-translate="1">גדוד הובלה 6920</option>
          <option data-no-translate="1">בית סרודי</option>
        </select>

        <button id="btnStart" class="primary" type="button" data-i18n>התחל</button>
        <p id="startError" class="error" hidden role="alert"></p>
      </section>

      <!-- QUIZ -->
      <section id="screen-quiz" class="card" hidden>
        <div class="topbar">
          <div id="progress" class="muted" aria-live="polite"></div>
        </div>

        <h2 id="questionTitle"></h2>

        <!-- Image before question -->
        <div id="leadWrap" class="lead" hidden>
          <img id="leadImg" alt="תמונה לשאלה" loading="lazy" data-i18n-alt />
          <div id="leadCap" class="lead-cap" hidden></div>
        </div>

        <!-- TWO -->
        <div id="twoWrap" class="two-images" hidden>
          <button class="img-choice" data-two="A" type="button">
            <img id="imgA" alt="אפשרות א" loading="lazy" data-i18n-alt />
            <div class="img-caption" id="capA"></div>
          </button>

          <button class="img-choice" data-two="B" type="button">
            <img id="imgB" alt="אפשרות ב" loading="lazy" data-i18n-alt />
            <div class="img-caption" id="capB"></div>
          </button>
        </div>

        <!-- HOTSPOT -->
        <div id="hotspotWrap" class="hotspot" hidden>
          <div class="hotspot-instructions muted" data-i18n>
            ניתן למחוק סימון ספציפי ולנסות מחדש.
          </div>

          <div id="hotspotStage" class="hotspot-stage">
            <img id="hotspotImg" alt="תמונת תקלה" loading="lazy" data-i18n-alt />
            <div id="hotspotOverlay" class="hotspot-overlay"></div>
          </div>

          <div class="hotspot-bottom">
            <div id="hotspotStatus" class="muted" aria-live="polite"></div>
            <div id="hotspotMarks" class="marks"></div>
          </div>
        </div>

        <!-- MC -->
        <div id="mcWrap" class="mc" hidden>
          <div id="mcHint" class="muted"></div>
          <div id="mcOptions" class="mc-options"></div>
        </div>

        <!-- IMG MULTI 10 -->
        <div id="imgMultiWrap" class="img-multi" hidden>
          <div id="imgMultiGrid" class="img-multi-grid"></div>
          <p id="imgMultiFeedback" class="feedback" hidden></p>
        </div>

        <!-- DRAG -->
        <div id="dragWrap" class="drag" hidden>
          <div id="dragIntro" hidden>
            <div class="drag-stage">
              <img id="dragIntroImg" alt="תרשים הסבר" loading="lazy" data-i18n-alt />
            </div>
          </div>

          <div id="dragPlay" hidden>
            <div class="drag-tools">
              <button id="btnShowChart" type="button" class="secondary" data-i18n>הצג תרשים</button>
            </div>

            <div class="drag-stage" id="dragStage">
              <img id="dragBg" alt="מדפים" loading="lazy" data-i18n-alt />
              <div id="dragZones"></div>

              <div id="dragItem" class="drag-item" draggable="true">
                <img id="dragItemImg" alt="מוצר" loading="lazy" data-i18n-alt />
                <div id="dragItemCap" class="drag-cap"></div>
              </div>
            </div>

            <p id="dragFeedback" class="feedback" hidden></p>
          </div>
        </div>

        <!-- MATCH LINES (3x3) -->
        <div id="matchWrap" class="match" hidden>
          <div id="matchStage" class="match-stage">
            <svg id="matchSvg" class="match-svg" aria-hidden="true"></svg>
            <div id="matchLeft" class="match-col match-left"></div>
            <div class="match-mid" aria-hidden="true"></div>
            <div id="matchRight" class="match-col match-right"></div>
          </div>
          <p id="matchError" class="error" hidden role="alert"></p>
        </div>

        <div class="actions">
          <button id="btnNext" class="primary" type="button" disabled data-i18n>המשך</button>
        </div>

        <p id="feedback" class="feedback" hidden></p>
      </section>

      <!-- RESULT -->
      <section id="screen-result" class="card" hidden>
        <h2 data-i18n>סיום</h2>
        <p id="sendStatus" class="muted" aria-live="polite"></p>
        <button id="btnResend" class="secondary" type="button" hidden data-i18n>שלח שוב</button>
      </section>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
